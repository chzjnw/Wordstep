${['sentence','spelling','relation'].map((m,i)=>{let saved=store.sessions[signature(m)];const resume=saved&&saved.index<saved.queue.length;const subtitle=['영어 문장의 빈칸에 들어갈 단어를<br>단어장 속 5개의 보기에서 골라요.','영어로 쓰인 뜻을 읽고 단어를 완성해요.<br>네모 칸에 알맞은 철자를 입력해요.','기준 단어쌍의 관계를 알아보고,<br>10쌍 중 같은 관계를 모두 골라요.'][i];return `<article class="mode"><div class="modeicon" aria-hidden="true">${['A＿','a□','↔'][i]}</div><span class="number">0${i+1}</span><h3>${MODE[m]}</h3><p>${subtitle}</p><div class="meta"><span>${total(m)}${m==='relation'?'쌍':'단어'}</span><div class="minibar"><i style="width:${completedCount(m)/total(m)*100}%"></i></div><span>${completedCount(m)} 완료</span></div><button class="primary start" data-mode="${m}"><span>${resume?'이어서 학습하기':'학습 시작하기'}</span><span aria-hidden="true">→</span></button></article>`}).join('')}</section>
<div class="fineprint"><strong>전체 범위가 빠짐없이 출제돼요.</strong> 빈칸·철자는 선택한 단어를 각각 한 번씩, 관계는 검증한 모든 단어쌍을 한 번씩 연습해요. 오답은 정답을 맞힌 뒤에도 복습 목록에 남아요.<details><summary>단어 범위와 관계 문제 안내</summary><p>표제어 60개에 각 1개의 직접 작성한 예문과 영영풀이가 있어요. ‘세부 단어까지 전체’를 선택하면 교재의 유의어·반의어·파생어·혼동어·표현을 포함한 ${WORDS.length}개를 연습해요. 본문 예문에만 등장하는 일반 단어와 활용형은 별도 항목으로 추가하지 않았어요.</p><p>관계 모드는 ‘표제어 / 전체’ 설정과 무관하게 선택한 DAY의 모든 관계쌍을 출제해요. DAY 선택은 기준 단어에 적용하며, 보기 단어와 보기 쌍은 두 DAY 전체에서 골라요. 유의어는 특정 뜻에서 비슷하다는 의미이며, 문법·뉘앙스까지 항상 같지는 않아요. 관계 해설에서 뜻과 차이를 확인할 수 있어요.</p><p>단어장 안에서 명확한 유의어·반의어를 확인하기 어려운 표제어(niche, bureaucracy, ecosystem, prosecute, liberate, resignation, infect)는 관계쌍으로 억지로 연결하지 않았어요. 이 단어들도 빈칸·철자 모드에서 모두 학습할 수 있어요.</p></details></div>
<div class="dictionary"><details id="dictionary" ${openWords?'open':''}><summary>단어장 펼치기 <span style="font-size:12px;font-weight:400;color:var(--muted)">· 뜻, 영영풀이, 예문, 관련어</span></summary><input class="search" id="search" type="search" placeholder="영어 단어 또는 한국어 뜻 검색" aria-label="단어 검색"><div id="dictionaryCount" class="sub" style="margin:0 0 12px"></div><div id="wordlist" class="wordlist"></div></details></div>
<div class="device-note">파일 자체에 모든 문제가 들어 있어요. 인터넷 없이 브라우저에서 실행할 수 있어요. iPad의 파일 미리보기에서 버튼이 동작하지 않으면 Safari에서 열어 주세요. 진도는 같은 브라우저에서 자동 저장되며, 필요하면 아래에서 백업할 수 있어요.</div>
<footer><span>WORDSTEP / DAY 24 & 25</span><div><button class="quiet" id="export" style="font-size:11px;padding:0 7px;min-height:44px">진도 백업</button><button class="quiet" id="import" style="font-size:11px;padding:0 7px;min-height:44px">백업 불러오기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></footer>`;
for(const k of ['day','scope','order']){let el=document.getElementById(k);el.value=store.prefs[k];el.onchange=()=>{store.prefs[k]=el.value;save();home()}}
app.querySelectorAll('.start').forEach(b=>b.onclick=()=>start(b.dataset.mode));document.getElementById('search').oninput=e=>dictionary(e.target.value);dictionary('');
document.getElementById('export').onclick=backup;document.getElementById('import').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=restore;
if(openWords)document.getElementById('dictionary').scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo(0,0)}
function dictionary(query){const q=normalized(query);const ws=eligible().filter(d=>normalized(d.w+' '+d.ko).includes(q));document.getElementById('dictionaryCount').textContent=`${ws.length}개 항목 · 현재 선택한 학습 범위`;document.getElementById('wordlist').innerHTML=ws.map(d=>{const ps=PAIRS.filter(p=>p.a===d.w||p.b===d.w);return `<details class="worditem"><summary><span class="word">${esc(d.w)}</span><span class="badge">${d.core?'표제어':'세부 단어'} · ${d.days.join('/')}</span></summary><p><strong>${esc(d.ko)}</strong> · ${esc(d.pos)}</p><p>${esc(d.defn)}</p><p class="example" lang="en">${esc(d.ex).replace(/\{([^}]+)\}/g,'<b>$1</b>')}</p>${ps.length?`<div class="rel">${ps.map(p=>`${p.t==='syn'?'유의':'반의'} · ${esc(p.a===d.w?p.b:p.a)}<br><span style="font-size:11px">${esc(p.note)}</span>`).join('<br>')}</div>`:'<p>확인된 관계쌍 없음 · 뜻과 철자로 학습해요.</p>'}</details>`}).join('')||'<p class="sub">검색 결과가 없어요.</p>'}
const synonyms=new Map(WORDS.map(d=>[d.w,new Set([d.w])]));
for(const p of PAIRS.filter(p=>p.t==='syn')){synonyms.get(p.a).add(p.b);synonyms.get(p.b).add(p.a)}
function sentenceOptions(d){let forbidden=new Set(synonyms.get(d.w));for(const w of [...forbidden])for(const n of synonyms.get(w)||[])forbidden.add(n);
// Prefer plausible grammatical choices. Exclude related headword families as well.
let pool=WORDS.filter(x=>x.core&&!forbidden.has(x.w)&&!x.w.startsWith(d.w.slice(0,5))&&!d.w.startsWith(x.w.slice(0,5)));
let same=shuffle(pool.filter(x=>x.pos===d.pos));let other=shuffle(pool.filter(x=>x.pos!==d.pos));return shuffle([d.w,...same.concat(other).slice(0,4).map(x=>x.w)])}
function makeQuestion(mode,id){if(mode==='sentence')return {id,options:sentenceOptions(MAP.get(id))};if(mode==='spelling')return {id};const ref=PAIRS.find(p=>p.id===id);let pool=PAIRS;const keyPair=p=>[p.a,p.b].sort().join('|');const available=pool.filter(p=>keyPair(p)!==keyPair(ref));const good=shuffle(available.filter(p=>p.t===ref.t)),bad=shuffle(available.filter(p=>p.t!==ref.t));const min=Math.max(1,10-bad.length),max=Math.min(9,good.length);const n=min+Math.floor(Math.random()*(max-min+1));return {id,options:shuffle(good.slice(0,n).concat(bad.slice(0,10-n)).map(p=>p.id))}}
function start(mode,opts={}){currentMode=mode;let key=signature(mode),saved=store.sessions[key];if(!opts.fresh&&!opts.ids&&saved&&saved.index<saved.queue.length){session=saved;session.key=key}else{let ids=opts.ids||(mode==='relation'?pairPool().map(p=>p.id):eligible().map(d=>d.w));if(store.prefs.order==='shuffle')ids=shuffle(ids);session={key,mode,queue:ids.map(id=>makeQuestion(mode,id)),index:0,missed:[],first:0,attempts:0,review:!!opts.ids};store.sessions[key]=session;save()}
resetQuestion();renderQuestion();window.scrollTo(0,0)}
function resetQuestion(){raw='';picked=[];wrongChoices=[];feedback=null;passed=false;tries=0;}
function current(){return session.queue[session.index]}
function checkpoint(){session.draft={raw,picked,wrongChoices,feedback,passed,tries};store.sessions[session.key]=session;save()}
function renderQuestion(){document.getElementById('navwords').hidden=true;const q=current();if(!q){finish();return}document.title=MODE[currentMode]+' · Wordstep';const d=currentMode!=='relation'?MAP.get(q.id):null;const ref=currentMode==='relation'?PAIRS.find(p=>p.id===q.id):null;
app.innerHTML=`<section class="practice"><div class="practicebar"><button class="quiet" id="back">← 홈</button><div class="progress" role="progressbar" aria-label="학습 진도" aria-valuemin="0" aria-valuemax="${session.queue.length}" aria-valuenow="${session.index}"><div style="width:${session.index/session.queue.length*100}%"></div></div><span class="fraction">${session.index+1} / ${session.queue.length}</span></div><div class="sessionmeta"><span>${MODE[currentMode]}${session.review?' · 오답 복습':''}</span><span>첫 시도 정답 ${session.first} · 오답 ${session.missed.length}</span></div><section class="question"><div class="q-label">${currentMode==='sentence'?'FILL IN THE BLANK':currentMode==='spelling'?'COMPLETE THE WORD':'CONNECT THE WORDS'}</div><h2>${currentMode==='sentence'?'빈칸에 알맞은 단어를 골라 주세요.':currentMode==='spelling'?'이 영영풀이가 설명하는 단어는?':'기준 단어쌍과 같은 관계를 모두 골라 주세요.'}</h2><p class="sub">${currentMode==='sentence'?'보기의 모든 단어는 첨부한 단어장에 있어요.':currentMode==='spelling'?'네모 칸을 눌러 단어의 전체 철자를 입력하세요.':'유의어인지 반의어인지 판단하고, 10쌍에서 일치하는 쌍을 모두 선택해요.'}</p>
${currentMode==='sentence'?`<p class="sentence" lang="en">${esc(d.ex).replace(/\{[^}]+\}/,'<span class="blank empty" aria-label="빈칸"></span>')}</p><div class="choices">${q.options.map((w,i)=>`<button class="choice wordchoice" data-word="${esc(w)}" aria-pressed="false"><span class="key">${i+1}</span><span>${esc(w)}</span></button>`).join('')}</div>`:currentMode==='spelling'?`<p class="definition" lang="en">${esc(d.defn)}</p><div class="spell-area" id="spellArea"><div class="letters" id="letters" aria-hidden="true"></div><input id="answer" class="spell-input" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="단어의 전체 철자 입력" maxlength="100"></div>`:`<div class="targetpair" lang="en"><span>${esc(ref.a)}</span><span class="link" aria-hidden="true">↔</span><span>${esc(ref.b)}</span></div><div class="relationchoices">${q.options.map((id,i)=>{let p=PAIRS.find(p=>p.id===id);return `<button class="choice pairchoice" data-pair="${esc(id)}" aria-pressed="false"><span class="checkbox" aria-hidden="true">✓</span><span class="pairwords" lang="en">${esc(p.a)}<span class="link">↔</span>${esc(p.b)}</span><span class="key">${i+1}</span></button>`}).join('')}</div>`}
<div class="q-tools"><span class="selectioncount" id="selectionCount">${currentMode==='relation'?'0쌍 선택 · 정답 개수는 비공개':''}</span></div><div id="solutionArea"></div></section><div class="actionbar"><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button class="primary" id="check" disabled>정답 확인</button></div></section>`;
document.getElementById('back').onclick=()=>{checkpoint();home()};document.getElementById('check').onclick=()=>passed?advance():check();app.querySelectorAll('.wordchoice').forEach(b=>b.onclick=()=>{if(passed)return;picked=[b.dataset.word];feedback=null;refresh();checkpoint()});app.querySelectorAll('.pairchoice').forEach(b=>b.onclick=()=>{if(passed)return;const id=b.dataset.pair;picked=picked.includes(id)?picked.filter(x=>x!==id):picked.concat(id);feedback=null;refresh();checkpoint()});
if(currentMode==='spelling'){const inp=document.getElementById('answer');inp.value=raw;inp.oncompositionstart=()=>isComposing=true;inp.oncompositionend=()=>{isComposing=false;raw=inp.value;refresh();checkpoint()};inp.oninput=()=>{raw=inp.value;feedback=null;refresh();checkpoint()};inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&!isComposing){e.preventDefault();if(passed)advance();else check()}};document.getElementById('spellArea').onclick=()=>{if(!passed)inp.focus()}}
refresh()}
function letters(){const d=MAP.get(current().id),full=normalized(raw);
// Rebuild phrase positions with exact whitespace offsets.
let position=0;document.getElementById('letters').innerHTML=d.w.split(' ').map(part=>{let s=`<span class="lettergroup">${[...part].map(ch=>{let i=position++;if(!/[a-z]/i.test(ch))return `<span class="punct">${esc(ch)}</span>`;return `<span class="box ${i===full.length&&!passed?'next':''}">${esc(full[i]||'')}</span>`}).join('')}</span>`;position++;return s}).join('')}
function refresh(){if(!session||!current())return;const q=current();let btn=document.getElementById('check');btn.disabled=!passed&&(currentMode==='spelling'?!normalized(raw):picked.length===0);btn.textContent=passed?(session.index+1===session.queue.length?'학습 완료':'다음 문제 →'):'정답 확인';
app.querySelectorAll('.wordchoice').forEach(b=>{const w=b.dataset.word;b.classList.toggle('selected',picked.includes(w));b.classList.toggle('wrong',wrongChoices.includes(w));b.classList.toggle('correct',passed&&w===q.id);b.disabled=passed;b.setAttribute('aria-pressed',String(picked.includes(w)))});
app.querySelectorAll('.pairchoice').forEach(b=>{b.classList.toggle('selected',picked.includes(b.dataset.pair));b.disabled=passed;b.setAttribute('aria-pressed',String(picked.includes(b.dataset.pair)))});
if(currentMode==='spelling'){document.getElementById('answer').disabled=passed;letters()}
if(currentMode==='relation')document.getElementById('selectionCount').textContent=`${picked.length}쌍 선택 · ${passed?'확인 완료':'정답 개수는 비공개'}`;
let f=document.getElementById('feedback');f.className='feedback'+(feedback?' '+(feedback.ok?'good':'bad'):'');f.innerHTML=feedback?`<strong>${esc(feedback.title)}</strong>${esc(feedback.text)}${feedback.small?`<small>${esc(feedback.small)}</small>`:''}`:`<span style="color:var(--muted);font-size:12px">${currentMode==='spelling'?'네모 칸을 눌러 입력해 주세요.':currentMode==='relation'?'해당하는 쌍을 모두 선택해 주세요.':'단어를 선택한 뒤 정답을 확인하세요.'}</span>`;
if(passed)solution()}
function check(){if(passed||isComposing)return;const q=current();if(currentMode==='spelling'&&!normalized(raw))return;if(currentMode!=='spelling'&&!picked.length)return;tries++;session.attempts++;let ok=false;
if(currentMode==='sentence')ok=picked[0]===q.id;else if(currentMode==='spelling'){const v=normalized(raw),answer=normalized(q.id);ok=v===answer}else{const ref=PAIRS.find(p=>p.id===q.id),correct=q.options.filter(id=>PAIRS.find(p=>p.id===id).t===ref.t);ok=picked.length===correct.length&&correct.every(id=>picked.includes(id))}
if(ok){passed=true;if(tries===1)session.first++;store.master[currentMode][q.id]=true;feedback={ok:true,title:'정답이에요!',text:'다음 단계로 갈 준비가 됐어요.'};if(currentMode==='sentence'){let blank=document.querySelector('.blank');blank.classList.remove('empty');blank.textContent=q.id}if(currentMode==='spelling')raw=q.id;
}else{if(!session.missed.includes(q.id))session.missed.push(q.id);if(currentMode==='sentence'){wrongChoices.push(picked[0]);picked=[];feedback={ok:false,title:'다시 생각해 볼까요?',text:'문맥에 맞는 다른 단어를 골라 주세요.'}}else if(currentMode==='spelling'){const val=normalized(raw);feedback={ok:false,title:/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(val)?'영문 키보드로 바꿔 주세요.':'철자를 다시 확인해 보세요.',text:'입력한 철자를 확인한 뒤 다시 시도해 주세요.'}}else feedback={ok:false,title:'아직 정확한 조합은 아니에요.',text:'빠진 쌍이나 다른 관계의 쌍이 있어요. 선택을 바꿔 다시 확인해 주세요.'}}
refresh();checkpoint();if(ok){document.getElementById('check').focus({preventScroll:true})}}
function solution(){const q=current();let html;if(currentMode==='relation'){const ref=PAIRS.find(p=>p.id===q.id);html=`<h3>기준 쌍: ${ref.t==='syn'?'유의어':'반의어'}</h3><p>${esc(ref.note)}</p><div class="solution-grid">${q.options.map(id=>{const p=PAIRS.find(p=>p.id===id);return `<div class="solution-row"><strong>${p.t===ref.t?'✓ 선택':'— 제외'} · ${esc(p.a)} ↔ ${esc(p.b)}</strong>${p.t==='syn'?'유의어':'반의어'} · ${esc(p.note)}<br>${esc(MAP.get(p.a).ko)} / ${esc(MAP.get(p.b).ko)}</div>`}).join('')}</div>`}else{const d=MAP.get(q.id);html=`<h3>${esc(d.w)} <span style="font-weight:400">· ${esc(d.ko)}</span></h3><p lang="en">${esc(d.defn)}</p><p lang="en">${esc(d.ex).replace(/\{([^}]+)\}/g,'<b>$1</b>')}</p>`}
document.getElementById('solutionArea').innerHTML=`<div class="solution">${html}</div>`}
function advance(){if(!passed)return;session.index++;delete session.draft;store.sessions[session.key]=session;save();resetQuestion();if(session.index>=session.queue.length)finish();else{renderQuestion();window.scrollTo(0,0)}}
function finish(){let active=session,mode=currentMode;const unique=[...new Set(active.missed)];app.innerHTML=`<section class="finish"><div class="finish-mark" aria-hidden="true">✓</div><div class="eyebrow">EVERY STEP COUNTS</div><h1>${active.queue.length}문제, 모두 맞혔어요.</h1><p>끝까지 직접 확인했어요. 헷갈렸던 단어를 한 번 더 만나면<br>내일 훨씬 쉽게 떠올릴 수 있을 거예요.</p><div class="stats"><div class="stat"><b>${active.queue.length}</b><span>정답 확인 완료</span></div><div class="stat"><b>${active.first}</b><span>첫 시도 정답</span></div><div class="stat"><b>${unique.length}</b><span>오답 복습 대상</span></div></div><div class="finish-actions">${unique.length?'<button class="primary" id="review">헷갈린 문제만 다시</button>':''}<button class="secondary" id="again">전체 다시 학습</button><button class="secondary" id="finishhome">홈으로</button></div>${unique.length?`<div class="misslist"><strong>다시 확인할 항목</strong>${unique.map(id=>{if(mode==='relation'){let p=PAIRS.find(p=>p.id===id);return `<div>${esc(p.a)} ↔ ${esc(p.b)} · ${p.t==='syn'?'유의어':'반의어'}</div>`}return `<div><strong>${esc(id)}</strong> · ${esc(MAP.get(id).ko)}</div>`}).join('')}</div>`:''}</section>`;if(unique.length)document.getElementById('review').onclick=()=>start(mode,{ids:unique,fresh:true});document.getElementById('again').onclick=()=>start(mode,{fresh:true});document.getElementById('finishhome').onclick=()=>home();window.scrollTo(0,0)}
function backup(){const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='wordstep-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function validBackup(d){if(d?.version!==1||!d.prefs||!['all','24','25'].includes(d.prefs.day)||!['core','all'].includes(d.prefs.scope)||!['shuffle','book'].includes(d.prefs.order)||!d.master||!d.sessions||typeof d.sessions!=='object')return false;for(const mode of Object.keys(MODE))if(!d.master[mode]||typeof d.master[mode]!=='object')return false;for(const s of Object.values(d.sessions)){if(!MODE[s.mode]||!Array.isArray(s.queue)||!s.queue.length||!Number.isInteger(s.index)||s.index<0||s.index>s.queue.length||!Array.isArray(s.missed)||typeof s.first!=='number')return false;for(const q of s.queue){if(s.mode==='relation'){if(!PAIRS.some(p=>p.id===q.id)||!Array.isArray(q.options)||q.options.length!==10||new Set(q.options).size!==10||q.options.some(id=>!PAIRS.some(p=>p.id===id)))return false}else if(!MAP.has(q.id)||(s.mode==='sentence'&&(!Array.isArray(q.options)||q.options.length!==5||!q.options.includes(q.id)||q.options.some(w=>!MAP.has(w)))))return false}}return true}
async function restore(e){try{const file=e.target.files[0];if(!file)return;if(file.size>5000000)throw Error('size');const d=JSON.parse(await file.text());if(!validBackup(d))throw Error('invalid');store=d;save();home();alert('학습 진도를 불러왔어요.')}catch(err){alert('이 앱에서 내보낸 진도 백업 파일인지 확인해 주세요.')}}
document.getElementById('navhome').onclick=()=>{if(session&&current())checkpoint();home()};document.getElementById('navwords').onclick=()=>{if(session&&current())checkpoint();home(true)};
document.addEventListener('keydown',e=>{if(!session||!current()||isComposing||e.isComposing||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Enter'){e.preventDefault();if(passed)advance();else check()}else if(!passed&&/^[1-9]$/.test(e.key)&&currentMode!=='spelling'){const idx=Number(e.key)-1,buttons=app.querySelectorAll(currentMode==='sentence'?'.wordchoice':'.pairchoice');buttons[idx]?.click()}else if(e.key==='0'&&!passed&&currentMode==='relation')app.querySelectorAll('.pairchoice')[9]?.click()});
// Restore an interrupted question, including answers that have already been checked.
const originalStart=start;start=function(mode,opts={}){let saved=store.sessions[signature(mode)],draft=!opts.fresh&&!opts.ids&&saved?.index<saved?.queue.length?saved.draft:null;originalStart(mode,opts);if(draft){({raw,picked,wrongChoices,feedback,passed,tries}=draft);renderQuestion();if(passed&&mode==='sentence'){let b=app.querySelector('.blank');b.classList.remove('empty');b.textContent=current().id}}};
home();
